name: Build CV

on: push

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest

    steps:
      - name: Get XeLaTeX
        run: sudo apt-get -qq update && sudo apt-get install -y --no-install-recommends texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra dvipng texlive-latex-recommended texlive-xetex lmodern texlive-science-doc texlive-science

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LaTeX
        run: xelatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Convert PDF to PNG
        run: |
          sudo apt-get install -y poppler-utils
          pdftoppm -png -r 200 resume.pdf resume

      - name: Upload CV images
        uses: actions/upload-artifact@v4
        with:
          name: resume-png
          path: resume-*.png

      - name: Commit PDF
        uses: EndBug/add-and-commit@v9
        with:
          add: resume.pdf
          author_name:  Kate Davison
          author_email: kate.davison@bristol.ac.uk
          message: "Build CV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
